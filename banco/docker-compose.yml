# PostGIS local do AgroValid. Mesma imagem da medição do ADR 0011 (tem build arm64).
#   docker compose -f banco/docker-compose.yml up -d
# URL: postgresql://agrovalid:agrovalid@localhost:5433/agrovalid
# Se a 5433 estiver ocupada, troque a porta do host: AGROVALID_PG_PORTA=5434 docker compose -f ... up -d
name: agrovalid-banco
services:
  postgis:
    image: imresamu/postgis:17-3.5
    container_name: agrovalid-postgis
    environment:
      POSTGRES_USER: agrovalid
      POSTGRES_PASSWORD: agrovalid
      POSTGRES_DB: agrovalid
    ports:
      - "127.0.0.1:${AGROVALID_PG_PORTA:-5433}:5432"
    volumes:
      - agrovalid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrovalid -d agrovalid"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  agrovalid_pgdata:
